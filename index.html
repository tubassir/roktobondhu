<style>
:root{--bg:#f6faf7;--cd:#fff;--tx:#17251e;--mu:#5d6f66;--rd:#c8102e;--rd2:#9f0c24;--rdt:#c8102e;--gr:#00704a;--gr2:#005a3b;--okt:#00704a;--ln:#dbe6df;--wn:#9a5b00;--on:#fff;--sf:#e8f3ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--cd:#18261f;--tx:#eaf3ee;--mu:#9bb0a5;--rd:#d72f4b;--rd2:#b92740;--rdt:#ff7389;--gr:#178a5b;--gr2:#117a4f;--okt:#5fd7a4;--ln:#2b3d34;--wn:#f0a94a;--sf:#1d2f26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a15;--cd:#18261f;--tx:#eaf3ee;--mu:#9bb0a5;--rd:#d72f4b;--rd2:#b92740;--rdt:#ff7389;--gr:#178a5b;--gr2:#117a4f;--okt:#5fd7a4;--ln:#2b3d34;--wn:#f0a94a;--sf:#1d2f26;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Hind Siliguri","Noto Sans Bengali",sans-serif}
.w{max-width:720px;margin:0 auto;padding:0 16px}
.dm{background:var(--sf);color:var(--okt);border-bottom:1px solid var(--ln);font-size:13px;padding:6px 16px;text-align:center}
.hd{display:flex;align-items:center;gap:8px;padding:12px 0}
.lg{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;color:var(--rdt)}
.lg svg{width:30px;height:30px}
button,a.btn{font-family:inherit}
.sm{min-height:40px;padding:0 12px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
#app{padding-bottom:96px;min-height:70vh}
h2{margin:8px 0 4px;font-size:23px;line-height:1.3}
.mu{color:var(--mu)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:10px;padding:0 16px;border:0;border-radius:12px;background:var(--rd);color:var(--on);font:700 17px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn:active{background:var(--rd2)}
.btn.g{background:var(--gr)}.btn.g:active{background:var(--gr2)}
.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}
.btn.big{min-height:60px;font-size:21px}
.hero{text-align:center;padding:24px 8px 8px}
.hero svg{width:84px;height:84px}
.hero h1{margin:6px 0 2px;font-size:32px;color:var(--rdt);line-height:1.2}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
label.ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px;min-height:40px;margin:10px 0}
label.ck input{width:22px;height:22px;min-height:0;margin-top:2px;flex:none;accent-color:var(--gr)}
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--tx);font:16px inherit;font-family:inherit}
textarea{min-height:70px}
:focus-visible{outline:3px solid var(--gr);outline-offset:2px}
.c{display:flex;gap:12px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px;color:inherit;text-decoration:none}
.b{flex:none;width:46px;height:46px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:var(--rd);color:var(--on);display:grid;place-items:center;margin:4px 6px 0 4px}
.b i{transform:rotate(45deg);font:700 16px/1 inherit;font-family:inherit;font-style:normal}
.i{flex:1;min-width:0;display:flex;flex-direction:column}
.i small{color:var(--mu);font-size:14px;overflow-wrap:anywhere}
.i small.s-ok{color:var(--okt);font-weight:600}.i small.s-w{color:var(--wn);font-weight:600}
.tg{font-style:normal;font-size:12px;font-weight:600;background:var(--sf);color:var(--okt);border-radius:6px;padding:1px 6px;margin-left:6px}
.em{text-align:center;color:var(--mu);padding:26px 12px;border:1px dashed var(--ln);border-radius:14px;margin-top:14px}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:4px 14px 14px;margin-top:14px}
.box h3{margin:12px 0 4px;font-size:17px}
summary{min-height:46px;display:flex;align-items:center;font-weight:700;color:var(--rdt);cursor:pointer}
ul{margin:6px 0;padding-left:20px}
.note{color:var(--mu);font-size:13px;margin-top:16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nav button{flex:1;min-height:46px;border:0;background:transparent;color:var(--mu);font:600 14px inherit;font-family:inherit;border-radius:10px;cursor:pointer}
#nav button.on{color:var(--rdt);background:var(--sf)}
#t{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:92%;text-align:center}
#t.show{opacity:1}
#alb{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--rd);color:var(--on);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(200,16,46,.45);animation:albr .25s ease}
@keyframes albr{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#alb[hidden]{display:none}
#alb .m{flex:1;font:600 14px/1.5 inherit;font-family:inherit}
#alb .m small{display:block;font-weight:400;opacity:.9}
#alb .go{border:0;border-radius:10px;background:#fff;color:#c8102e;font:700 14px inherit;font-family:inherit;min-height:40px;padding:0 16px;cursor:pointer;white-space:nowrap}
#alb .x{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:10px;min-height:40px;padding:0 11px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.rdy{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.5}
.rdy small{display:block;margin-top:2px;font-weight:400;opacity:.85;font-size:13px}
.rdy.s-ok{background:#e7f5ee;color:#0b5e3d;border:1px solid #bfe5d2}
.rdy.s-w{background:#fff6e0;color:#7a5300;border:1px solid #f3dfae}
.rdy.s-no{background:#f2f3f5;color:#5a5f66;border:1px solid var(--ln)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#t{transition:none}}
.hero2{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#c8102e,#8e0e24);color:#fff;border-radius:22px;padding:22px 20px;margin-top:6px}.hero2 h2{margin:0;font-size:28px;line-height:1.3;flex:1}.hero2 svg{width:96px;height:96px;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.tile{display:flex;flex-direction:column;gap:4px;background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:16px;color:var(--tx);text-decoration:none;min-height:130px}.tile .ti{font-size:34px;line-height:1}.tile b{font-size:18px}.tile small{color:var(--mu);font-size:14px}
.sec{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.sec h3{margin:0;font-size:19px}.sec a{color:var(--rdt);text-decoration:none;font-weight:600}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.dc{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;padding:8px 4px;font-family:inherit;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-height:58px;font-size:15px}.dc small{color:var(--mu);font-size:12px}
#mp{height:380px;border-radius:16px;margin:14px 0;position:relative;z-index:0;border:1px solid var(--ln);background:var(--sf)}
.tabs2{display:flex;gap:8px;margin:6px 0}.tabs2 button{flex:1;min-height:44px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;font:600 16px inherit;font-family:inherit;cursor:pointer}.tabs2 button.on{background:var(--rd);color:var(--on);border-color:var(--rd)}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 20px/1 sans-serif;border:2px solid #fff;box-shadow:0 1px 4px #0006}.pin.hospital{background:#c8102e}.pin.blood{background:#00704a;font-size:15px}
.b2{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 24px/1 sans-serif}.b2.hospital{background:var(--rd)}.b2.blood{background:var(--gr);font-size:18px}
.call.n{background:var(--gr2)}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;min-height:54px}#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mi{display:flex;align-items:center;gap:14px;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px;color:var(--tx);text-decoration:none}
.mi .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--sf);display:grid;place-items:center}
.mi .ic svg{width:26px;height:26px;stroke:var(--rdt);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mi .tx{flex:1;display:flex;flex-direction:column;line-height:1.35}.mi small{color:var(--mu);font-size:14px}.mi .ch{color:var(--mu);font-size:28px}
.ecards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ecard{display:flex;flex-direction:column;gap:3px;border-radius:18px;padding:16px;min-height:108px;text-decoration:none;color:#fff;box-shadow:0 4px 14px rgba(15,26,21,.12)}
.ecard.r{background:linear-gradient(135deg,#c8102e,#8e0e24)}
.ecard.g{background:linear-gradient(135deg,#00704a,#00563a)}
.ecard .ei{font-size:26px;line-height:1;margin-bottom:4px}
.ecard b{font-size:18px}.ecard small{font-size:13px;opacity:.93}
.qs{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-top:14px}
.qs>div{flex:1 1 130px}
.qs label{margin:0 0 4px;font-size:13px}
.qs .btn{margin:0;flex:0 0 auto;min-width:96px}
.tile{position:relative}
.nw{position:absolute;top:10px;right:10px;background:var(--rd);color:var(--on);font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 8px}
.tp{display:inline-block;font-size:12px;font-weight:700;color:var(--okt);background:var(--sf);border-radius:6px;padding:2px 8px;margin-right:6px}
.ct{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
.ct th,.ct td{border:1px solid var(--ln);padding:7px 10px;text-align:left;vertical-align:top}
.ct th{background:var(--sf)}
.post p{margin:10px 0;line-height:1.75}
.post ul{line-height:1.7}
.post h3{margin:18px 0 6px}
.amb9{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#00704a,#00563a);color:#fff;border-radius:18px;padding:18px;margin-top:14px}
.amb9 .ei{font-size:40px;flex:none}
.amb9 .btn{margin:0;min-width:110px;background:#fff;color:#00563a}
/* ===== নতুন হোম: বাংলাদেশ-থিম v5 ===== */
.heroBD{position:relative;background:linear-gradient(140deg,var(--gr),var(--gr2));border-radius:20px;color:#fff;padding:18px;overflow:hidden;display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.heroBD .sun{position:absolute;right:-26px;top:50%;transform:translateY(-50%);width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 36% 36%,#ef2a4a,#c8102e 72%);box-shadow:0 6px 24px rgba(0,0,0,.22)}
.heroBD .sun svg{position:absolute;inset:0;margin:auto;width:54px;height:54px}
.heroBD .tx{position:relative;z-index:1;flex:1;max-width:64%}
.heroBD .tx b{font-size:19px;display:block}
.heroBD .tx small{font-size:12.5px;opacity:.93;display:block;margin:3px 0 10px;line-height:1.5}
.heroBD .cta{display:inline-block;background:#fff;color:#c8102e;font-weight:700;font-size:14px;border-radius:999px;padding:9px 15px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.heroBD .c9{display:inline-block;margin-left:8px;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:8px 12px;color:#fff;font-size:12.5px;font-weight:600;text-decoration:none}
.imp{display:flex;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:10px 0;margin:0 0 14px;text-align:center}
.imp>div{flex:1}
.imp b{font-size:17px;color:var(--rdt);display:block;line-height:1.25}
.imp small{font-size:10.5px;color:var(--mu)}
.imp>div+div{border-left:1px solid var(--ln)}
.sect2{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.sect2 h3{font-size:15px}
.sect2 a{font-size:12px;color:var(--gr);font-weight:600;text-decoration:none}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:10px 4px 8px;text-align:center;position:relative;text-decoration:none;color:var(--tx)}
.it:active{transform:scale(.97)}
.it .e{width:40px;height:40px;margin:0 auto 6px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}
.it .t{font-size:10.5px;display:block;font-weight:600;line-height:1.3}
.it .nw{position:absolute;top:-6px;right:-2px;background:var(--gr);color:#fff;font-size:8.5px;font-weight:700;border-radius:999px;padding:2px 6px}
:root{--tt1:#fde8ec;--tc1:#c8102e;--tt2:#e2f3ea;--tc2:#00704a;--tt3:#fff0dd;--tc3:#b45c00;--tt4:#e3edfa;--tc4:#1d5fbf;--tt5:#fdf3d7;--tc5:#9a7400;--tt6:#ece6f7;--tc6:#6b4bbf;--tt7:#e9f0f6;--tc7:#3b5b7c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tt1:#3a1c22;--tc1:#ff9aab;--tt2:#15291f;--tc2:#5fd7a4;--tt3:#33261a;--tc3:#f0b46a;--tt4:#182739;--tc4:#8ab4f0;--tt5:#33290f;--tc5:#ffd76a;--tt6:#251d38;--tc6:#c2adf0;--tt7:#1d2a38;--tc7:#a9c3dd}}
:root[data-theme="dark"]{--tt1:#3a1c22;--tc1:#ff9aab;--tt2:#15291f;--tc2:#5fd7a4;--tt3:#33261a;--tc3:#f0b46a;--tt4:#182739;--tc4:#8ab4f0;--tt5:#33290f;--tc5:#ffd76a;--tt6:#251d38;--tc6:#c2adf0;--tt7:#1d2a38;--tc7:#a9c3dd}
.t1{background:var(--tt1);color:var(--tc1)}.t2{background:var(--tt2);color:var(--tc2)}.t3{background:var(--tt3);color:var(--tc3)}.t4{background:var(--tt4);color:var(--tc4)}.t5{background:var(--tt5);color:var(--tc5)}.t6{background:var(--tt6);color:var(--tc6)}.t7{background:var(--tt7);color:var(--tc7)}
.rdy2{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin:0 0 12px}
.rdy2 .rg{position:relative;width:58px;height:58px;flex:0 0 58px}
.rdy2 .rg svg{transform:rotate(-90deg);display:block}
.rdy2 .rg .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:var(--mu);line-height:1.15}
.rdy2 .rg .n b{font-size:14px;color:var(--gr);line-height:1.1}
.rdy2 .tx2{flex:1}
.rdy2 .tx2 b{font-size:14px;display:block}
.rdy2 .tx2 small{font-size:11.5px;color:var(--mu);display:block;line-height:1.5}
.wab{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:#1faa53;color:#fff;border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:700;text-decoration:none}
.wab2{display:flex;align-items:center;justify-content:center;gap:4px;background:#1faa53;color:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;text-decoration:none;min-height:42px}
.c .ac{margin-left:auto;display:flex;flex-direction:column;gap:6px;justify-content:center}
.ftrBD{text-align:center;margin:20px 0 10px;font-size:13px;color:var(--mu);line-height:1.7}
.ftrBD b{color:var(--rdt)}
.bdgx{display:inline-block;background:var(--sf);border:1px solid var(--ln);color:var(--okt);border-radius:999px;padding:8px 18px;font-weight:700;font-size:14.5px}
</style>

{id:'b3',tg:'জ্ঞান',t:'থ্যালাসেমিয়া রোগীদের জীবনরেখা হলেন নিয়মিত দাতারা',a:'রক্তবন্ধু ডেস্ক',d:'১৩ নভেম্বর ২০২৬',x:`<p>বাংলাদেশে হাজার হাজার শিশু থ্যালাসেমিয়া নিয়ে জন্মায়। এই রোগে শরীর যথেষ্ট লোহিত রক্তকণিকা তৈরি করতে পারে না, তাই তাদের নিয়মিত — অনেক সময় মাসে এক-দুই বার — রক্ত নিতে হয়, সারাজীবন।</p><p>একজন নিয়মিত দাতা মানে কোনো একটি পরিবারের কাছে স্থির আশা। একই দাতা নিয়মিত রক্ত দিলে হাসপাতালের পরিকল্পনাও সহজ হয়। রক্তবন্ধুতে দাতারা নিজের রক্তদানের ইতিহাস রাখতে পারেন — কখন শেষ দিয়েছেন, কোথায় দিয়েছেন, আর কত দিন পর আবার দিতে পারবেন।</p><p>আরেকটি কথা: থ্যালাসেমিয়া প্রতিরোধে বিয়ের আগে থ্যালাসেমিয়া স্ক্রিনিং খুব গুরুত্বপূর্ণ। বিস্তারিত জানতে ডাক্তারের পরামর্শ নিন।</p>`},
{id:'b2',tg:'গল্প',t:'প্রথমবার রক্ত দিতে যাওয়ার দিন — নতুন একজন দাতার সাধারণ অভিজ্ঞতা',a:'রক্তবন্ধু ডেস্ক',d:'১২ নভেম্বর ২০২৬',x:`<p>নতুন প্রায় প্রতিজন দাতাই প্রথম দিনে একই দুশ্চিন্তা নিয়ে ব্লাড ব্যাংকের সামনে দাঁড়ান — ব্যথা লাগবে তো? পরে দুর্বল হয়ে যাব তো? অনেকের অভিজ্ঞতার মিলটা কেমন, সেটাই এই লেখায়।</p><p>নিবন্ধন ও পরীক্ষা শেষে সিরিঞ্জ লাগার আগ পর্যন্ত সময়টাই সবচেয়ে ভারী লাগে। শুরু হলে অনেকেরই খেয়াল থাকে না — কাজ শেষ হয়ে যায় সাত-আট মিনিটে। এক ব্যাগ (প্রায় ৪৫০ মিলিলিটার) রক্ত দিয়ে স্বেচ্ছাসেবকরা বিস্কুট-জুস খেয়ে কিছুক্ষণ বিশ্রাম নিয়েই বাড়ি ফিরে যান। পরের দিন জীবন স্বাভাবিক।</p><p>সবচেয়ে বড় পুরস্কারটা আসে কয়েকদিন পর — কোনো অপরিচিত মানুষের ছোট্ট মেসেজ: “আপনার রক্তে আমার মা বেঁচে উঠেছে।” এই অনুভূতিই দাতাদের বারবার ফিরিয়ে আনে।</p><p>আপনি কি প্রথমবার দিতে চান? সতর্কতা পেজে যোগ্যতা দেখে নিন। দ্বিধা হলে ব্লাড ব্যাংকের কর্মীদের জিজ্ঞেস করুন — তারা সব ভয় কেটে দেবেন।</p>`},
{id:'b1',tg:'জ্ঞান',t:'রক্ত দিলে কি দুর্বল হয়ে যায়? প্রচলিত ৫ ভুল ধারণার জবাব',a:'রক্তবন্ধু ডেস্ক',d:'১০ নভেম্বর ২০২৬',x:`<p>রক্তদান নিয়ে ভয় ও ভুল ধারণা এখনো অনেককে দাতা হতে আটকে রাখে। চলুন সবচেয়ে প্রচলিত ৫টির জবাব জেনে নিই।</p><h3>১. “রক্ত দিলে দুর্বল হয়ে যাব”</h3><p>সুস্থ শরীর এক ব্যাগ রক্তের ঘাটতি দ্রুতই পূরণ করে — তরল অংশ ২৪-৪৮ ঘণ্টায়, লোহিত কণিকা কয়েক সপ্তাহে। পর্যাপ্ত পানি আর বিশ্রাম নিলে পরদিনই স্বাভাবিক থাকেন বেশিরভাগ মানুষ।</p><h3>২. “মোটা মানুষের রক্ত ভালো হয়”</h3><p>রক্তের মান নির্ভর করে স্বাস্থ্য ও হিমোগ্লোবিনের মাত্রার ওপর — শরীরের আকারের ওপর নয়। দানের আগে ব্লাড ব্যাংকই পরীক্ষা করে নিশ্চিত করে।</p><h3>৩. “নারীরা রক্ত দিতে পারেন না”</h3><p>একেবারেই না — বয়স, ওজন ও হিমোগ্লোবিন ঠিক থাকলে নারীরাও নিয়মিত দাতা। শুধু গর্ভাবস্থা ও স্তন্যদানের সময় দেওয়া যায় না।</p><h3>৪. “একবার দিলে সারাজীবন দিতে হয়”</h3><p>দান সম্পূর্ণ স্বেচ্ছায় — কত বার ও কখন দেবেন সেটা আপনার সিদ্ধান্ত। নিয়ম শুধু এটাই: দুই দানের মাঝে ৩-৪ মাস বিরতি।</p><h3>৫. “দরকারে কিনে নেওয়া যায়, দিতে হয় না”</h3><p>বাংলাদেশে রক্ত কেনাবেচা নিষিদ্ধ ও নিন্দনীয়। নিরাপদ রক্তের একমাত্র উৎস স্বেচ্ছাসেবী দাতা। রক্তের জন্য কেউ টাকা চাইলে সেটি রিপোর্ট করুন।</p><p>জানা থাকলে ভয় কমে। যোগ্যতা ও সতর্কতা জানতে অ্যাপের সতর্কতা পেজটি দেখুন।</p>`}];
