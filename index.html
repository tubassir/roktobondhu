return`<h2>বাংলাদেশের মানচিত্র</h2><p class="mu">বিভাগ বা জেলা বেছে হাসপাতাল ও ব্লাড ব্যাংক খুঁজুন</p>
<div class="dg">${DS.map(k=>`<button class="dc" data-act="mdiv" data-id="${k}"><b>${k}</b><small>${bn(cnt[k]||0)} জন দাতা</small></button>`).join('')}</div>
<form id="f-m">${loc('m',{},1)}</form>
<div class="row"><button class="btn" data-act="geo">এলাকা খুঁজুন</button><button class="btn g" data-act="findhere">এই এলাকায় দেখান</button></div>
<div id="mp"></div>
<div class="tabs2"><button class="on" data-act="ptab" data-id="hospital">হাসপাতাল</button><button data-act="ptab" data-id="blood">ব্লাড ব্যাংক</button></div>
<div id="pl"><p class="em">জেলা বেছে নিন, অথবা মানচিত্র জুম করে “এই এলাকায় দেখান” চাপুন।</p></div>
<p class="note">তথ্য OpenStreetMap থেকে আসে। ফোন নম্বর বা ঠিকানা পুরনো হতে পারে, যাওয়ার আগে ফোন করে নিশ্চিত হোন। ব্লাড ব্যাংকের তথ্য কম থাকতে পারে।</p>`};
function initMap(){const el=$('#mp');if(!el)return;
if(!window.L){el.innerHTML='<p class="em">মানচিত্র লোড হয়নি। ইন্টারনেট দেখে পাতা রিফ্রেশ করুন।</p>';return}
if(MAP){try{MAP.remove()}catch(e){}MAP=null}
MAP=L.map(el).setView([23.8,90.35],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP);
LAY=L.layerGroup().addTo(MAP);drawPlaces();renderList()}
function drawPlaces(){if(!MAP||!LAY)return;LAY.clearLayers();
PLACES.filter(p=>p.k===PF).forEach(p=>{const ic=L.divIcon({className:'',html:`<div class="pin ${p.k}">${p.k==='blood'?'💧':'+'}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
L.marker([p.la,p.lo],{icon:ic}).addTo(LAY).bindPopup(`<b>${E(p.n)}</b>${p.ad?'<br>'+E(p.ad):''}${p.ph?'<br><a href="tel:'+E(tel(p.ph))+'">'+E(p.ph)+'</a>':''}`)})}
function renderList(){const el=$('#pl');if(!el||!PLACES.length)return;const L2=PLACES.filter(p=>p.k===PF);
el.innerHTML=L2.length?L2.slice(0,60).map(p=>`<div class="c"><span class="b2 ${p.k}">${p.k==='blood'?'💧':'+'}</span><div class="i"><b>${E(p.n)}</b>${p.ad?`<small>${E(p.ad)}</small>`:''}<small>${p.ph?E(p.ph):'ফোন নম্বর নেই'}</small></div><div class="act">${p.ph?`<a class="call" href="tel:${E(tel(p.ph))}">কল</a>`:''}<a class="call n" href="https://www.google.com/maps/dir/?api=1&destination=${p.la},${p.lo}" target="_blank" rel="noopener">পথ</a></div></div>`).join(''):`<p class="em">এই এলাকায় ${PF==='blood'?'ব্লাড ব্যাংক':'হাসপাতাল'} পাওয়া যায়নি। মানচিত্র সরিয়ে বা জুম আউট করে আবার চেষ্টা করুন।</p>`}
async function findHere(){if(!MAP)return toast('মানচিত্র লোড হয়নি');
if(MAP.getZoom()<10)return toast('আরও জুম করুন বা জেলা বেছে নিন');
const b=MAP.getBounds(),bb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(v=>v.toFixed(5)).join(',');
const q=`[out:json][timeout:25];(nwr["amenity"="hospital"](${bb});nwr["amenity"="blood_bank"](${bb});nwr["healthcare"="blood_bank"](${bb});nwr["healthcare"="blood_donation"](${bb}););out center 150;`;
$('#pl').innerHTML='<p class="em">খোঁজা হচ্ছে…</p>';
let j=null;for(const u of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const r=await fetch(u+'?data='+encodeURIComponent(q));if(r.ok){j=await r.json();break}}catch(e){}}
if(!j){$('#pl').innerHTML='<p class="em">তথ্য আনা যায়নি। একটু পরে আবার চেষ্টা করুন।</p>';return}
PLACES=j.elements.map(e=>{const t=e.tags||{};return{id:e.type+e.id,k:kindOf(t),n:t['name:bn']||t.name||'নামহীন',ph:(t.phone||t['contact:phone']||'').split(';')[0].trim(),ad:t['addr:full']||[t['addr:street'],t['addr:city']].filter(Boolean).join(', '),la:e.lat!=null?e.lat:(e.center&&e.center.lat),lo:e.lon!=null?e.lon:(e.center&&e.center.lon)}}).filter(p=>p.la!=null);
drawPlaces();renderList()}
async function geo(){if(!MAP)return toast('মানচিত্র লোড হয়নি');const u=V('mu'),d=V('md'),dv=V('mdv');
if(!u&&!d&&!dv)return toast('বিভাগ, জেলা বা উপজেলা দিন');
const q=[u,d,(dv&&!d)?dv+' বিভাগ':''].filter(Boolean).join(', ')+', বাংলাদেশ';
try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=bn&countrycodes=bd&q='+encodeURIComponent(q));const j=await r.json();
if(!j.length)return toast('এলাকা খুঁজে পাওয়া যায়নি');const b=j[0].boundingbox;MAP.fitBounds([[+b[0],+b[2]],[+b[1],+b[3]]]);await findHere()}catch(e){toast('এলাকা খোঁজা যায়নি, একটু পরে চেষ্টা করুন')}}
async function render(){if(CFG.apiKey.startsWith('PASTE')){$('#app').innerHTML='<p class="em">Firebase কনফিগ এখনো বসানো হয়নি। index.html এর ওপরের CFG অংশে আপনার মান বসান।</p>';return}const f={home,map:mapPage,search,register,login,request,me,admin,donor:()=>pDonor(cur.p)}[cur.r]||home;let h;
try{h=await f()}catch(x){h='<p class="em">কিছু ভুল হয়েছে। আবার চেষ্টা করুন।</p>'}
$('#app').innerHTML=h;$('#bk').hidden=!stack.length;$('#hl').textContent=sess()?'আমার':'প্রবেশ';$('#hl').dataset.go=sess()?'me':'login';
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===cur.r));
if(cur.r==='search')res();if(cur.r==='map')initMap();window.scrollTo(0,0)}
let tm;function toast(m){const t=$('#t');t.textContent=m;t.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('show'),3200)}
const reset=r=>{stack=[];cur={r};render()};
document.addEventListener('click',async ev=>{const a=ev.target.closest('[data-go],[data-act]');if(!a)return;ev.preventDefault();const d=a.dataset,id=d.id;try{
if(d.go){if(d.root!==undefined)stack=[];return go(d.go,d.p)}
const u=sess();
if(d.act==='bk'){cur=stack.pop()||{r:'home'};return render()}
if(d.act==='google'){await signInWithPopup(auth,new GoogleAuthProvider());const g=await DB.get('donors',sess());return reset(g?'me':'register')}
if(d.act==='mdiv'){const sl=$('#mdv');sl.value=id;sl.dispatchEvent(new Event('change',{bubbles:true}));return}
if(d.act==='findhere'){await findHere();return}
if(d.act==='geo'){await geo();return}
if(d.act==='ptab'){PF=id;document.querySelectorAll('.tabs2 button').forEach(b=>b.classList.toggle('on',b.dataset.id===PF));drawPlaces();renderList();return}
if(d.act==='card'){const cx=await DB.get('donors',sess());if(cx)await shareCard(cx);return}
if(d.act==='deldon'){await DB.del('donations',id);await sync(sess());toast('মুছে ফেলা হয়েছে')}
if(d.act==='out'){await signOut(auth);return reset('home')}
if(d.act==='creq'){const m=await DB.get('donors',u);await DB.put('creq',{id:u+'_'+id,to:id,from:u,fromName:m.n,ok:null});toast('অনুরোধ পাঠানো হয়েছে')}
if(d.act==='share'||d.act==='deny'){const r=await DB.get('creq',id);r.ok=d.act==='share';await DB.put('creq',r);if(r.ok){const m=(await DB.get('donorsPrivate',u))||{id:u,p:auth.currentUser.phoneNumber||'',sp:false,shared:[]};m.shared=[...(m.shared||[]),r.from];await DB.put('donorsPrivate',m)}toast(r.ok?'নম্বর শেয়ার করা হয়েছে':'অনুরোধ বাতিল')}
if(d.act==='close'){const r=await DB.get('requests',id);r.open=false;await DB.put('requests',r);toast('অনুরোধ বন্ধ হয়েছে')}
if(d.act==='sus'||d.act==='unsus'){const x=await DB.get('donors',id);if(x){x.sus=d.act==='sus';await DB.put('donors',x)}if(d.rid)await DB.del('reps',d.rid)}
if(d.act==='dis')await DB.del('reps',d.rid);
if(d.act==='delacct'){if(!d.sure){a.dataset.sure=1;a.textContent='নিশ্চিত? আবার চাপুন';return}await DB.del('donors',u);await DB.del('donorsPrivate',u);await signOut(auth);toast('প্রোফাইল মুছে গেছে');return reset('home')}
render()}catch(x){toast('ব্যর্থ হয়েছে: '+(x.code||x.message))}});
document.addEventListener('change',async ev=>{const t=ev.target;
if(t.dataset.dv!==undefined){const s=$('#'+t.dataset.dv+'d'),any=s.options[0].textContent.startsWith('সব');s.innerHTML=o(t.value?DIV[t.value]:(any?ALLD:[]),'',any?'সব জেলা':'বেছে নিন')}
if(t.dataset.pv){const c=t.dataset.pv==='sp'?'donorsPrivate':'donors',x=await DB.get(c,sess());x[t.dataset.pv]=t.checked;await DB.put(c,x);toast('সেটিং সংরক্ষিত হয়েছে')}
if(MAP&&t.id==='mdv'&&t.value&&CEND[t.value])MAP.setView(CEND[t.value],9,{animate:false});
if(MAP&&t.id==='md'&&t.value&&CEN[t.value]){MAP.setView(CEN[t.value],10,{animate:false});findHere()}
if(t.closest('#f-s'))res()});
document.addEventListener('input',ev=>{if(ev.target.id==='su')res()});
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target.id;try{
const fields=()=>({n:V('fn'),g:V('fg'),dv:V('fdv'),d:V('fd'),u:V('fu'),ld:$('#fl').value,av:$('#fa').checked,ph:$('#fph')&&$('#fph').checked?(auth.currentUser.photoURL||''):''});
if(f==='f-reg'||f==='f-edit'){const x=fields(),u=sess(),p=ph(V('fp'));if(!u)return toast('আগে প্রবেশ করুন');if(!okp(p))return toast('সঠিক মোবাইল নম্বর দিন, যেমন 01712345678');
const pv0=(await DB.get('donorsPrivate',u))||{id:u,sp:false,shared:[]};pv0.p=p;
if(f==='f-reg'){await DB.put('donors',{id:u,hid:false,sus:false,dn:0,dp:0,...x});await DB.put('donorsPrivate',pv0);toast('নিবন্ধন সম্পন্ন হয়েছে');return reset('me')}
const m=await DB.get('donors',u);await DB.put('donors',Object.assign(m,x));await DB.put('donorsPrivate',pv0);toast('প্রোফাইল সংরক্ষিত হয়েছে');return render()}
if(f==='f-login'){const p=ph(V('lp'));if(!okp(p))return toast('সঠিক মোবাইল নম্বর দিন');try{if(window.rv)window.rv.clear()}catch(x){}window.rv=new RecaptchaVerifier(auth,'lb',{size:'invisible'});window.cf=await signInWithPhoneNumber(auth,'+88'+p,window.rv);$('#f-login').hidden=true;$('#f-otp').hidden=false;return toast('কোড পাঠানো হয়েছে')}
if(f==='f-otp'){await window.cf.confirm(V('lo'));const x=await DB.get('donors',sess());return reset(x?'me':'register')}
if(f==='f-req'){if(!sess())return toast('অনুরোধ পোস্ট করতে আগে প্রবেশ করুন');const p=ph(V('qp'));if(!okp(p))return toast('সঠিক মোবাইল নম্বর দিন');
const q={id:uid(),g:V('qg'),b:V('qb'),dv:V('qdv'),d:V('qd'),u:V('qu'),h:V('qh'),urg:V('qurg'),n:V('qn'),p,by:sess()||'anon',ts:Date.now(),open:true};await DB.put('requests',q);
const k=(await DB.pub()).filter(x=>x.g===q.g&&x.d===q.d&&!x.hid&&!x.sus&&st(x)[0]==='s-ok').length;toast('অনুরোধ পোস্ট হয়েছে। এই জেলায় '+bn(k)+' জন প্রস্তুত দাতা আছেন।');return render()}
if(f==='f-don'){const u=sess(),h=V('dh'),dd=V('dd'),dt=$('#dt').value;if(!u||!h||!dd||!dt)return toast('সব ঘর পূরণ করুন');await DB.put('donations',{id:uid(),uid:u,h,d:dd,dt});await sync(u);toast('রক্তদান যোগ হয়েছে');return render()}
if(f==='f-rep'){if(!sess())return toast('রিপোর্ট করতে আগে প্রবেশ করুন');await DB.put('reps',{id:uid(),to:ev.target.dataset.id,why:V('rr'),txt:V('rt'),by:sess()||'anon'});toast('রিপোর্ট পাঠানো হয়েছে, ধন্যবাদ');return render()}}catch(x){toast('ব্যর্থ হয়েছে: '+(x.code||x.message))}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
onAuthStateChanged(auth,async u=>{ADM=false;if(u){ADM=!!(await DB.get('admins',u.uid))}render()});
</script>
</body>
</html>
