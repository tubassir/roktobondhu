summary{min-height:46px;display:flex;align-items:center;font-weight:700;color:var(--rdt);cursor:pointer}
ul{margin:6px 0;padding-left:20px}

@media (prefers-reduced-motion:reduce){#t{transition:none}}

<body>
<div class="dm">পরীক্ষামূলক (বিটা) সংস্করণ। আপনার ফোন নম্বর কখনো প্রকাশ্য হয় না।</div>
<div class="w">

<div class="lg"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2C16 2 6 14 6 20a10 10 0 0020 0C26 14 16 2 16 2z" fill="var(--rd)"/><path d="M16 14v8M12 18h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg><span>রক্তবন্ধু বাংলাদেশ</span></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

/* Firebase Console থেকে পাওয়া মানগুলো এখানে বসান */
const CFG={apiKey:"AIzaSyCvfYlmg7_UDnDk5HY4jR_k-nMDuzrdV_g",authDomain:"roktobondhu-ca076.firebaseapp.com",projectId:"roktobondhu-ca076",storageBucket:"roktobondhu-ca076.firebasestorage.app",messagingSenderId:"1094106020636",appId:"1:1094106020636:web:005ea987f32c1f75a118d9"};
const app=initializeApp(CFG),auth=getAuth(app),fs=getFirestore(app);
auth.languageCode='bn';
/* নোট (পুরনো পরিকল্পনা):
   - Auth: Firebase Phone Auth। sess() কে onAuthStateChanged দিয়ে বদলান, uid = donors/{uid}।
   - DB: নিচের all/get/put/del চারটি মেথড Firestore দিয়ে বদলান (collection: donors, requests, creq, reps)।
   - গোপনীয়তা: সার্চযোগ্য donors ডকুমেন্টে ফোন রাখবেন না। ফোন আলাদা private ডকুমেন্টে রাখুন, শুধু মালিক ও অনুমতিপ্রাপ্তরা পড়বে।
   - অ্যাডমিন: custom claim (admin:true)। রিপোর্ট ও স্থগিতের কাজ Rules দিয়ে সীমিত করুন। */
const G=["A+","A-","B+","B-","O+","O-","AB+","AB-"];
const DIV={"ঢাকা":["ঢাকা","গাজীপুর","নারায়ণগঞ্জ","নরসিংদী","মানিকগঞ্জ","মুন্সিগঞ্জ","কিশোরগঞ্জ","টাঙ্গাইল","ফরিদপুর","মাদারীপুর","শরীয়তপুর","রাজবাড়ী","গোপালগঞ্জ"],"চট্টগ্রাম":["চট্টগ্রাম","কক্সবাজার","কুমিল্লা","ব্রাহ্মণবাড়িয়া","চাঁদপুর","নোয়াখালী","ফেনী","লক্ষ্মীপুর","খাগড়াছড়ি","রাঙামাটি","বান্দরবান"],"রাজশাহী":["রাজশাহী","নাটোর","নওগাঁ","চাঁপাইনবাবগঞ্জ","পাবনা","বগুড়া","সিরাজগঞ্জ","জয়পুরহাট"],"খুলনা":["খুলনা","যশোর","সাতক্ষীরা","বাগেরহাট","নড়াইল","মাগুরা","ঝিনাইদহ","কুষ্টিয়া","চুয়াডাঙ্গা","মেহেরপুর"],"বরিশাল":["বরিশাল","পটুয়াখালী","ভোলা","পিরোজপুর","ঝালকাঠি","বরগুনা"],"সিলেট":["সিলেট","মৌলভীবাজার","হবিগঞ্জ","সুনামগঞ্জ"],"রংপুর":["রংপুর","দিনাজপুর","কুড়িগ্রাম","গাইবান্ধা","লালমনিরহাট","নীলফামারী","পঞ্চগড়","ঠাকুরগাঁও"],"ময়মনসিংহ":["ময়মনসিংহ","জামালপুর","নেত্রকোণা","শেরপুর"]};
const DS=Object.keys(DIV),ALLD=DS.flatMap(k=>DIV[k]);
const URG=["অতি জরুরি (আজই)","২৪ ঘণ্টার মধ্যে","২–৩ দিনের মধ্যে"];
const WHY=["ভুয়া বা মিথ্যা তথ্য","বিরক্ত বা হয়রানি করেছে","টাকা চেয়েছে","অন্য কারণ"];
const $=s=>document.querySelector(s),V=i=>$('#'+i).value.trim();
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const o=(a,v,f)=>(f!=null?`<option value="">${f}</option>`:'')+a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
const ph=v=>v.replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c)).replace(/[\s-]/g,'').replace(/^\+?88/,'');
const okp=p=>/^01[3-9]\d{8}$/.test(p);
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=new Date().toISOString().slice(0,10);
const mem={};
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(x){return mem[k]}};
const wr=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
const cv=d=>({id:d.id,...d.data()});
const DB={async all(c){return(await getDocs(collection(fs,c))).docs.map(cv)},
async pub(){return(await getDocs(query(collection(fs,'donors'),where('hid','==',false),where('sus','==',false)))).docs.map(cv)},
async q(c,k,v){return(await getDocs(query(collection(fs,c),where(k,'==',v)))).docs.map(cv)},
async get(c,id){try{const r=await getDoc(doc(fs,c,id));return r.exists()?cv(r):null}catch(x){return null}},
async put(c,x){const{id,...r}=x;await setDoc(doc(fs,c,id),r);return x},
async del(c,id){await deleteDoc(doc(fs,c,id))}};
let ADM=false;const sess=()=>auth.currentUser?auth.currentUser.uid:null,isAdm=()=>ADM;
const wait=d=>d.ld?Math.max(0,120-Math.floor((Date.now()-new Date(d.ld))/864e5)):0;
const st=d=>!d.av?['s-no','এখন দিতে অনিচ্ছুক']:wait(d)?['s-w','আর '+bn(wait(d))+' দিন পর প্রস্তুত']:['s-ok','রক্ত দিতে প্রস্তুত'];
function seed(){if(rd('rb2_seed'))return;
const L=[["ঢাকা","ঢাকা","মিরপুর"],["চট্টগ্রাম","চট্টগ্রাম","পাহাড়তলী"],["রাজশাহী","রাজশাহী","বোয়ালিয়া"],["খুলনা","খুলনা","সোনাডাঙ্গা"],["সিলেট","সিলেট","জালালাবাদ"],["বরিশাল","বরিশাল","কাউনিয়া"],["রংপুর","রংপুর","তাজহাট"],["ময়মনসিংহ","ময়মনসিংহ","মুক্তাগাছা"]];
const ago=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
wr('rb2_donors',Array.from({length:16},(_,i)=>{const l=L[(i+(i>7?1:0))%8];return{id:'demo'+i,demo:true,n:'ডেমো দাতা '+bn(i+1),g:G[i%8],dv:l[0],d:l[1],u:l[2],p:'017000000'+(10+i),ld:i%4===1?ago(40):i%4===2?'':ago(200+i),av:i!==5&&i!==11,sp:false,hid:false,sus:false,shared:[]}}));wr('rb2_seed',1)}
const loc=(p,v={},any)=>{const dv=v.dv||'';return`<div class="row"><div><label for="${p}dv">বিভাগ</label><select id="${p}dv" data-dv="${p}"${any?'':' required'}>${o(DS,dv,any?'সব বিভাগ':'বেছে নিন')}</select></div><div><label for="${p}d">জেলা</label><select id="${p}d"${any?'':' required'}>${o(dv?DIV[dv]:(any?ALLD:[]),v.d,any?'সব জেলা':'বেছে নিন')}</select></div></div><label for="${p}u">উপজেলা${any?' (ঐচ্ছিক)':''}</label><input id="${p}u" value="${E(v.u||'')}" placeholder="যেমন: মিরপুর"${any?'':' required'}>`};
const pf=(x={})=>`<label for="fn">পূর্ণ নাম</label><input id="fn" value="${E(x.n||'')}" autocomplete="name" required>
<label for="fg">রক্তের গ্রুপ</label><select id="fg" required>${o(G,x.g,'বেছে নিন')}</select>${loc('f',x)}
<label for="fl">সর্বশেষ রক্ত দেওয়ার তারিখ (না দিলে ফাঁকা রাখুন)</label><input id="fl" type="date" max="${today}" value="${x.ld||''}">
<label class="ck"><input id="fa" type="checkbox"${x.av!==false?' checked':''}> আমি এখন রক্ত দিতে ইচ্ছুক</label>`;
const card=x=>{const s=st(x);return`<a class="c" href="#" data-go="donor" data-p="${x.id}"><span class="b"><i>${E(x.g)}</i></span><div class="i"><b>${E(x.n)}${x.demo?'<em class="tg">ডেমো</em>':''}</b><small>${E(x.u)}, ${E(x.d)}, ${E(x.dv)} বিভাগ</small><small class="${s[0]}">${s[1]}</small></div></a>`};
let cur={r:'home'},stack=[];
function go(r,p){stack.push(cur);cur={r,p};render()}
const home=async()=>{const D=(await DB.pub()).filter(x=>!x.hid&&!x.sus).length,Q=(await DB.all('requests')).filter(x=>x.open).length;
return`<section class="hero"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2C16 2 6 14 6 20a10 10 0 0020 0C26 14 16 2 16 2z" fill="var(--rd)"/><path d="M16 14v8M12 18h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg><h1>রক্তবন্ধু বাংলাদেশ</h1><p class="mu">গ্রুপ ও এলাকা অনুযায়ী রক্তদাতা খুঁজুন</p></section>
<a class="btn big" href="#" data-go="search">রক্তদাতা খুঁজুন</a>
<a class="btn g" href="#" data-go="request">জরুরি রক্তের অনুরোধ</a>
<a class="btn o" href="#" data-go="register">দাতা হিসেবে নিবন্ধন করুন</a>
<div class="box"><h3>এখন তালিকায়</h3><div class="kv"><span>দাতা (ডেমোসহ)</span><b>${bn(D)}</b></div><div class="kv"><span>চলমান অনুরোধ</span><b>${bn(Q)}</b></div></div>
<div class="box"><h3>আপনার গোপনীয়তা</h3><ul><li>ফোন নম্বর ডিফল্টভাবে লুকানো থাকে।</li><li>নম্বর দেখতে হলে দাতার অনুমতি লাগে।</li><li>সন্দেহজনক প্রোফাইল রিপোর্ট করা যায়।</li></ul></div>
<p class="note"><a href="#" data-go="admin" style="color:inherit">অ্যাডমিন (ডেমো)</a></p>`};
const search=async()=>`<h2>রক্তদাতা খুঁজুন</h2><form id="f-s"><label for="sg">রক্তের গ্রুপ</label><select id="sg">${o(G,'','সব গ্রুপ')}</select>${loc('s',{},1)}</form><div id="rs"></div>`;
async function res(){const g=V('sg'),dv=V('sdv'),d=V('sd'),u=V('su');
const L=(await DB.pub()).filter(x=>!x.hid&&!x.sus&&(!g||x.g===g)&&(!dv||x.dv===dv)&&(!d||x.d===d)&&(!u||x.u.includes(u)));
L.sort((a,b)=>(st(a)[0]==='s-ok'?0:1)-(st(b)[0]==='s-ok'?0:1));
$('#rs').innerHTML=`<p class="mu">${bn(L.length)} জন পাওয়া গেছে</p>`+(L.length?L.map(card).join(''):'<p class="em">কোনো দাতা পাওয়া যায়নি। গ্রুপ বা এলাকা বদলে দেখুন।</p>')}
async function pDonor(id){const x=await DB.get('donors',id);if(!x||x.sus)return'<p class="em">প্রোফাইল পাওয়া যায়নি।</p>';
const me=sess(),s=st(x);let ct;
if(x.id===me)ct='<p class="mu">এটি আপনার নিজের প্রোফাইল।</p>';
else if(!me)ct='<p class="mu">যোগাযোগের অনুরোধ পাঠাতে <a href="#" data-go="login">প্রবেশ করুন</a>।</p>';
else{const pv=await DB.get('donorsPrivate',id);if(pv&&pv.p)ct=`<a class="btn g" href="tel:${E(pv.p)}">কল করুন: ${E(pv.p)}</a>`;else{const sent=await DB.get('creq',me+'_'+id);ct=sent?'<p class="mu">অনুরোধ পাঠানো হয়েছে। দাতা অনুমতি দিলে নম্বর এখানে দেখা যাবে।</p>':`<button class="btn g" data-act="creq" data-id="${x.id}">যোগাযোগের অনুরোধ পাঠান</button>`}}
return`<h2>${E(x.n)}${x.demo?'<em class="tg">ডেমো</em>':''}</h2>
<div class="box"><div class="kv"><span>রক্তের গ্রুপ</span><b>${E(x.g)}</b></div><div class="kv"><span>এলাকা</span><b>${E(x.u)}, ${E(x.d)}</b></div><div class="kv"><span>বিভাগ</span><b>${E(x.dv)}</b></div><div class="kv"><span>অবস্থা</span><b class="${s[0]}">${s[1]}</b></div></div>
${x.demo?'<p class="note">এটি ডেমো প্রোফাইল, বাস্তব মানুষ নয়।</p>':''}${ct}
<details class="box"><summary>এই প্রোফাইল রিপোর্ট করুন</summary><form id="f-rep" data-id="${x.id}"><label for="rr">কারণ</label><select id="rr" required>${o(WHY,'','বেছে নিন')}</select><label for="rt">বিস্তারিত (ঐচ্ছিক)</label><textarea id="rt"></textarea><button class="btn o" type="submit">রিপোর্ট পাঠান</button></form></details>`}
const register=async()=>{if(!sess())return login();if(await DB.get('donors',sess()))return me();return`<h2>দাতা হিসেবে নিবন্ধন</h2><p class="mu">আপনার ফোন নম্বর প্রকাশ্যে দেখানো হবে না।</p><form id="f-reg">${pf()}<label class="ck"><input id="fc" type="checkbox" required> আমি জানি আমার গ্রুপ ও এলাকা (উপজেলা পর্যন্ত) সবার সার্চে দেখা যাবে।</label><button class="btn" type="submit">নিবন্ধন করুন</button></form>`};
const login=async()=>`<h2>প্রবেশ করুন</h2><form id="f-login"><label for="lp">মোবাইল নম্বর</label><input id="lp" type="tel" inputmode="numeric" placeholder="01712345678" required><button class="btn" type="submit" id="lb">কোড পাঠান</button></form><form id="f-otp" hidden><label for="lo">SMS এ আসা ৬ সংখ্যার কোড</label><input id="lo" inputmode="numeric" maxlength="6" required><button class="btn" type="submit">যাচাই করুন</button></form><p class="note">প্রথমবার হলে কোড যাচাইয়ের পর নিবন্ধনের ফর্ম আসবে। আপনার নম্বর কখনো সার্চে বা প্রোফাইলে প্রকাশ্য হয় না।</p>`;
const request=async()=>{const me=sess(),A=await DB.all('requests'),L=A.filter(x=>x.open).sort((a,b)=>URG.indexOf(a.urg)-URG.indexOf(b.urg)||b.ts-a.ts);
return`<h2>জরুরি রক্তের অনুরোধ</h2>
<details class="box"><summary>নতুন অনুরোধ পোস্ট করুন</summary><form id="f-req"><div class="row"><div><label for="qg">রক্তের গ্রুপ</label><select id="qg" required>${o(G,'','বেছে নিন')}</select></div><div><label for="qb">কত ব্যাগ</label><input id="qb" type="number" min="1" max="20" value="1" required></div></div>${loc('q')}
<label for="qh">হাসপাতাল</label><input id="qh" required><label for="qurg">কখন লাগবে</label><select id="qurg" required>${o(URG,URG[1])}</select>
<label for="qn">যোগাযোগকারীর নাম</label><input id="qn" required><label for="qp">যোগাযোগের নম্বর</label><input id="qp" type="tel" inputmode="numeric" placeholder="01712345678" required>
<label class="ck"><input id="qc" type="checkbox" required> আমি সম্মতি দিচ্ছি, এই নম্বর অনুরোধের সাথে প্রকাশ্যে দেখানো হবে।</label><button class="btn" type="submit">অনুরোধ পোস্ট করুন</button></form></details>`+
(L.length?L.map(x=>`<div class="c"><span class="b"><i>${E(x.g)}</i></span><div class="i"><b>${bn(x.b)} ব্যাগ রক্ত লাগবে</b><small>${E(x.h)}, ${E(x.u)}, ${E(x.d)}</small><small class="s-w">${E(x.urg)}</small><small>${E(x.n)}</small></div><div style="display:flex;flex-direction:column;gap:6px"><a class="sm btn g" style="min-height:42px;margin:0" href="tel:${E(x.p)}">কল</a>${x.by===me||x.by==='anon'||isAdm()?`<button class="sm" data-act="close" data-id="${x.id}">পূরণ হয়েছে</button>`:''}</div></div>`).join(''):'<p class="em">এখন কোনো চলমান অনুরোধ নেই।</p>')+'<p class="note">অনুরোধ পোস্ট করতে প্রবেশ করা লাগবে।</p>'};
async function me(){const u=sess();if(!u)return isAdm()?admin():login();const x=await DB.get('donors',u);if(!x)return isAdm()?admin():register();const pv=(await DB.get('donorsPrivate',u))||{};
const R=(await DB.q('creq','to',u)).filter(r=>r.ok===null);
return`<h2>আমার প্রোফাইল</h2>
<div class="box"><h3>যোগাযোগের অনুরোধ</h3>${R.length?R.map(r=>`<div class="kv"><span>${E(r.fromName)}</span><span><button class="sm" data-act="share" data-id="${r.id}">নম্বর দিন</button> <button class="sm" data-act="deny" data-id="${r.id}">না</button></span></div>`).join(''):'<p class="mu">কোনো নতুন অনুরোধ নেই।</p>'}</div>
<div class="box"><h3>গোপনীয়তা সেটিং</h3><label class="ck"><input type="checkbox" data-pv="sp"${pv.sp?' checked':''}> লগইন করা সবাইকে আমার ফোন নম্বর দেখান (বন্ধ থাকলে শুধু অনুমতি দিলে)</label><label class="ck"><input type="checkbox" data-pv="hid"${x.hid?' checked':''}> সার্চ থেকে আমার প্রোফাইল লুকান</label></div>
<form id="f-edit" class="box">${pf(x)}<button class="btn" type="submit">সংরক্ষণ করুন</button></form>
<button class="btn o" data-act="out">লগআউট</button><button class="btn o" data-act="delacct">অ্যাকাউন্ট মুছুন</button>`}
async function admin(){if(!isAdm())return`<h2>অ্যাডমিন</h2><p class="mu">শুধু অ্যাডমিনের জন্য।</p>`;
const P=await DB.all('reps'),D=await DB.all('donors'),nm=id=>(D.find(x=>x.id===id)||{n:'(মুছে গেছে)'}).n,S=D.filter(x=>x.sus);
return`<h2>অ্যাডমিন মডারেশন</h2><div class="box"><h3>রিপোর্ট (${bn(P.length)})</h3>${P.length?P.map(r=>`<div class="kv" style="flex-wrap:wrap"><span><b>${E(nm(r.to))}</b><br><small class="mu">${E(r.why)}${r.txt?': '+E(r.txt):''}</small></span><span><button class="sm" data-act="sus" data-id="${r.to}" data-rid="${r.id}">স্থগিত</button> <button class="sm" data-act="dis" data-rid="${r.id}">বাতিল</button></span></div>`).join(''):'<p class="mu">কোনো রিপোর্ট নেই।</p>'}</div>
<div class="box"><h3>স্থগিত প্রোফাইল (${bn(S.length)})</h3>${S.length?S.map(x=>`<div class="kv"><span>${E(x.n)}</span><button class="sm" data-act="unsus" data-id="${x.id}">চালু করুন</button></div>`).join(''):'<p class="mu">কোনোটি নেই।</p>'}</div><button class="btn o" data-act="out">অ্যাডমিন থেকে বের হন</button>`}
async function render(){if(CFG.apiKey.startsWith('PASTE')){$('#app').innerHTML='<p class="em">Firebase কনফিগ এখনো বসানো হয়নি। index.html এর ওপরের CFG অংশে আপনার মান বসান।</p>';return}const f={home,search,register,login,request,me,admin,donor:()=>pDonor(cur.p)}[cur.r]||home;let h;
try{h=await f()}catch(x){h='<p class="em">কিছু ভুল হয়েছে। আবার চেষ্টা করুন।</p>'}
$('#app').innerHTML=h;$('#bk').hidden=!stack.length;$('#hl').textContent=sess()?'আমার':'প্রবেশ';$('#hl').dataset.go=sess()?'me':'login';
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===cur.r));
if(cur.r==='search')res();window.scrollTo(0,0)}
let tm;function toast(m){const t=$('#t');t.textContent=m;t.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('show'),3200)}
const reset=r=>{stack=[];cur={r};render()};
document.addEventListener('click',async ev=>{const a=ev.target.closest('[data-go],[data-act]');if(!a)return;ev.preventDefault();const d=a.dataset,id=d.id;try{
if(d.go){if(d.root!==undefined)stack=[];return go(d.go,d.p)}
const u=sess();
if(d.act==='bk'){cur=stack.pop()||{r:'home'};return render()}
if(d.act==='out'){await signOut(auth);return reset('home')}
if(d.act==='creq'){const m=await DB.get('donors',u);await DB.put('creq',{id:u+'_'+id,to:id,from:u,fromName:m.n,ok:null});toast('অনুরোধ পাঠানো হয়েছে')}
if(d.act==='share'||d.act==='deny'){const r=await DB.get('creq',id);r.ok=d.act==='share';await DB.put('creq',r);if(r.ok){const m=(await DB.get('donorsPrivate',u))||{id:u,p:auth.currentUser.phoneNumber||'',sp:false,shared:[]};m.shared=[...(m.shared||[]),r.from];await DB.put('donorsPrivate',m)}toast(r.ok?'নম্বর শেয়ার করা হয়েছে':'অনুরোধ বাতিল')}
if(d.act==='close'){const r=await DB.get('requests',id);r.open=false;await DB.put('requests',r);toast('অনুরোধ বন্ধ হয়েছে')}
if(d.act==='sus'||d.act==='unsus'){const x=await DB.get('donors',id);if(x){x.sus=d.act==='sus';await DB.put('donors',x)}if(d.rid)await DB.del('reps',d.rid)}
if(d.act==='dis')await DB.del('reps',d.rid);
if(d.act==='delacct'){if(!d.sure){a.dataset.sure=1;a.textContent='নিশ্চিত? আবার চাপুন';return}await DB.del('donors',u);await DB.del('donorsPrivate',u);await signOut(auth);toast('প্রোফাইল মুছে গেছে');return reset('home')}
render()}catch(x){toast('ব্যর্থ হয়েছে: '+(x.code||x.message))}});
document.addEventListener('change',async ev=>{const t=ev.target;
if(t.dataset.dv!==undefined){const s=$('#'+t.dataset.dv+'d'),any=s.options[0].textContent.startsWith('সব');s.innerHTML=o(t.value?DIV[t.value]:(any?ALLD:[]),'',any?'সব জেলা':'বেছে নিন')}
if(t.dataset.pv){const c=t.dataset.pv==='sp'?'donorsPrivate':'donors',x=await DB.get(c,sess());x[t.dataset.pv]=t.checked;await DB.put(c,x);toast('সেটিং সংরক্ষিত হয়েছে')}
if(t.closest('#f-s'))res()});
document.addEventListener('input',ev=>{if(ev.target.id==='su')res()});
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target.id;try{
const fields=()=>({n:V('fn'),g:V('fg'),dv:V('fdv'),d:V('fd'),u:V('fu'),ld:$('#fl').value,av:$('#fa').checked});
if(f==='f-reg'||f==='f-edit'){const x=fields(),u=sess();if(!u)return toast('আগে প্রবেশ করুন');
if(f==='f-reg'){await DB.put('donors',{id:u,hid:false,sus:false,...x});await DB.put('donorsPrivate',{id:u,p:auth.currentUser.phoneNumber||'',sp:false,shared:[]});toast('নিবন্ধন সম্পন্ন হয়েছে');return reset('me')}
const m=await DB.get('donors',u);await DB.put('donors',Object.assign(m,x));toast('প্রোফাইল সংরক্ষিত হয়েছে');return render()}
if(f==='f-login'){const p=ph(V('lp'));if(!okp(p))return toast('সঠিক মোবাইল নম্বর দিন');try{if(window.rv)window.rv.clear()}catch(x){}window.rv=new RecaptchaVerifier(auth,'lb',{size:'invisible'});window.cf=await signInWithPhoneNumber(auth,'+88'+p,window.rv);$('#f-login').hidden=true;$('#f-otp').hidden=false;return toast('কোড পাঠানো হয়েছে')}
if(f==='f-otp'){await window.cf.confirm(V('lo'));const x=await DB.get('donors',sess());return reset(x?'me':'register')}
if(f==='f-req'){if(!sess())return toast('অনুরোধ পোস্ট করতে আগে প্রবেশ করুন');const p=ph(V('qp'));if(!okp(p))return toast('সঠিক মোবাইল নম্বর দিন');
const q={id:uid(),g:V('qg'),b:V('qb'),dv:V('qdv'),d:V('qd'),u:V('qu'),h:V('qh'),urg:V('qurg'),n:V('qn'),p,by:sess()||'anon',ts:Date.now(),open:true};await DB.put('requests',q);
const k=(await DB.pub()).filter(x=>x.g===q.g&&x.d===q.d&&!x.hid&&!x.sus&&st(x)[0]==='s-ok').length;toast('অনুরোধ পোস্ট হয়েছে। এই জেলায় '+bn(k)+' জন প্রস্তুত দাতা আছেন।');return render()}
if(f==='f-rep'){if(!sess())return toast('রিপোর্ট করতে আগে প্রবেশ করুন');await DB.put('reps',{id:uid(),to:ev.target.dataset.id,why:V('rr'),txt:V('rt'),by:sess()||'anon'});toast('রিপোর্ট পাঠানো হয়েছে, ধন্যবাদ');return render()}}catch(x){toast('ব্যর্থ হয়েছে: '+(x.code||x.message))}});
onAuthStateChanged(auth,async u=>{ADM=false;if(u){ADM=!!(await DB.get('admins',u.uid))}render()});
</script>
